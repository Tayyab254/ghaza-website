<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Ghaza Laptops & Computers</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #10b981;
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-light); }

        header { background: #020617; border-bottom: 1px solid var(--border); padding: 1rem 2rem; position: sticky; top: 0; z-index: 100; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.4rem; font-weight: bold; color: #60a5fa; text-decoration: none; }
        .nav-links { display: flex; gap: 1.5rem; list-style: none; align-items: center; }
        .nav-links a { color: var(--text-light); text-decoration: none; font-weight: 500; }
        .nav-links a:hover { color: #60a5fa; }

        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .breadcrumb { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1.5rem; }
        .breadcrumb a { color: #60a5fa; text-decoration: none; }

        .details-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; }
        @media (max-width: 768px) { .details-wrapper { grid-template-columns: 1fr; } }

        /* Image Gallery Styling */
        .gallery-container { display: flex; flex-direction: column; gap: 1rem; }
        .main-image-box { width: 100%; height: 350px; background: #020617; border: 1px solid var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .main-image-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .thumbnails { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.5rem; }
        .thumb { width: 70px; height: 70px; background: #020617; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; object-fit: contain; flex-shrink: 0; }
        .thumb.active { border-color: var(--primary); }

        /* Product Info Styling */
        .info-container { display: flex; flex-direction: column; justify-content: space-between; }
        .product-title { font-size: 1.8rem; margin-bottom: 0.5rem; color: #f8fafc; }
        .product-price { font-size: 1.8rem; color: var(--secondary); font-weight: bold; margin: 1rem 0; }
        .section-title { font-size: 1.1rem; color: #60a5fa; border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; margin: 1.2rem 0 0.8rem 0; }
        .description-text { color: var(--text-muted); line-height: 1.6; font-size: 0.95rem; white-space: pre-line; }

        /* Action Buttons */
        .action-box { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border); display: flex; gap: 1rem; flex-wrap: wrap; }
        .btn { padding: 0.8rem 1.8rem; border-radius: 8px; font-weight: bold; text-decoration: none; cursor: pointer; border: none; font-size: 1rem; text-align: center; flex: 1; min-width: 200px; }
        .btn-order { background: var(--secondary); color: white; }
        .btn-order:hover { background: #059669; }
        .btn-back { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
        .btn-back:hover { color: white; border-color: white; }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">Ghaza Laptops & Computers</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html" style="color: #60a5fa;">Shop & Services</a></li>
                <li><a href="account.html">Account</a></li>
            </ul>
        </div>
    </header>

    <div class="container">
        <div class="breadcrumb">
            <a href="shop.html">← Back to Shop</a> / <span id="breadTitle">Product Details</span>
        </div>

        <div class="details-wrapper" id="detailsContent">
            <!-- Dynamic Product Content will load here -->
        </div>
    </div>

    <script>
        function getQueryParam(param) {
            var urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        function loadProductDetails() {
            var prodId = getQueryParam('id');
            var stock = JSON.parse(localStorage.getItem('ghaza_stock') || '[]');
            var product = stock.find(function(item) { return String(item.id) === String(prodId); });

            var container = document.getElementById('detailsContent');

            if (!product) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 3rem 1rem;">
                        <h2>❌ Product Not Found</h2>
                        <p style="color: var(--text-muted); margin: 1rem 0;">The requested item might have been removed or updated.</p>
                        <a href="shop.html" class="btn btn-order" style="display: inline-block; width: auto;">Return to Shop</a>
                    </div>`;
                return;
            }

            document.getElementById('breadTitle').textContent = product.title;

            // Handle Images
            var imagesList = [];
            if (product.images && product.images.length > 0) {
                imagesList = product.images;
            } else if (product.image) {
                imagesList = [product.image];
            }

            var mainImageHtml = imagesList.length > 0 
                ? `<img id="mainImg" src="${imagesList[0]}" alt="${product.title}">`
                : `<div style="color: var(--text-muted);">🖼️ No Image Available</div>`;

            var thumbsHtml = '';
            if (imagesList.length > 1) {
                imagesList.forEach(function(imgSrc, index) {
                    thumbsHtml += `<img src="${imgSrc}" class="thumb ${index === 0 ? 'active' : ''}" onclick="changeMainImage('${imgSrc}', this)">`;
                });
            }

            var descriptionHtml = product.fullDescription 
                ? product.fullDescription 
                : (product.specs || 'No additional specifications listed for this product.');

            container.innerHTML = `
                <div class="gallery-container">
                    <div class="main-image-box">
                        ${mainImageHtml}
                    </div>
                    <div class="thumbnails">
                        ${thumbsHtml}
                    </div>
                </div>

                <div class="info-container">
                    <div>
                        <h1 class="product-title">${product.title}</h1>
                        <p style="color: var(--text-muted); font-size: 0.95rem;">${product.specs || ''}</p>
                        <div class="product-price">Rs. ${product.price}</div>

                        <div class="section-title">📋 Product Overview & Detailed Specs</div>
                        <div class="description-text">${descriptionHtml}</div>
                    </div>

                    <div class="action-box">
                        <a href="checkout.html?prodId=${product.id}" class="btn btn-order">🛒 Order Now</a>
                        <a href="shop.html" class="btn btn-back">Continue Shopping</a>
                    </div>
                </div>
            `;
        }

        function changeMainImage(src, element) {
            document.getElementById('mainImg').src = src;
            var thumbs = document.querySelectorAll('.thumb');
            thumbs.forEach(function(t) { t.classList.remove('active'); });
            element.classList.add('active');
        }

        window.onload = loadProductDetails;
    </script>
</body>
</html>
