<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Ghaza Laptops & Computers</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #10b981;
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --required: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-light); }

        header { background: #020617; border-bottom: 1px solid var(--border); padding: 1rem 2rem; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.4rem; font-weight: bold; color: #60a5fa; text-decoration: none; }
        .req-star { color: var(--required); font-weight: bold; }

        .checkout-box { max-width: 600px; margin: 3rem auto; padding: 2rem; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; }
        .form-group { margin-bottom: 1.2rem; text-align: left; }
        label { display: block; margin-bottom: 0.4rem; font-size: 0.88rem; color: #cbd5e1; }
        input, textarea, select { width: 100%; padding: 0.75rem; border-radius: 6px; background: #020617; border: 1px solid var(--border); color: white; }

        .btn { padding: 0.8rem 1.6rem; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; width: 100%; background: var(--primary); color: white; }
        .btn:hover { background: var(--primary-dark); }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">Ghaza Laptops & Computers</a>
        </div>
    </header>

    <div class="checkout-box">
        <h2 style="color: #60a5fa; margin-bottom: 1rem;">🛍️ Complete Purchase</h2>
        
        <form id="checkoutForm">
            <div class="form-group">
                <label for="custName">Full Name <span class="req-star">*</span></label>
                <input type="text" id="custName" required>
            </div>
            <div class="form-group">
                <label for="custPhone">WhatsApp Phone Number <span class="req-star">*</span></label>
                <input type="tel" id="custPhone" required>
            </div>
            <div class="form-group">
                <label for="custAddress">Delivery Address <span class="req-star">*</span></label>
                <textarea id="custAddress" rows="2" required></textarea>
            </div>
            <div class="form-group">
                <label for="payMethod">Payment Option <span class="req-star">*</span></label>
                <select id="payMethod" required>
                    <option value="Cash on Delivery">Cash on Delivery</option>
                    <option value="Bank Transfer / EasyPaisa">Bank Transfer / EasyPaisa</option>
                </select>
            </div>
            <button type="submit" class="btn">Confirm & Place Order</button>
        </form>
    </div>

    <script>
        // Enforce user authentication before allowing checkout
        window.onload = function() {
            var activeUser = sessionStorage.getItem('ghaza_active_user');
            if (!activeUser) {
                alert("You must log in or create an account to place an order.");
                window.location.href = "account.html";
                return;
            }

            // Autofill user information if logged in
            var user = JSON.parse(activeUser);
            if (user) {
                document.getElementById('custName').value = user.fullName || '';
                document.getElementById('custPhone').value = user.phone || '';
            }
        };

        document.getElementById('checkoutForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            var order = {
                orderId: "GHZ-" + Math.floor(1000 + Math.random() * 9000),
                customerName: document.getElementById('custName').value.trim(),
                phone: document.getElementById('custPhone').value.trim(),
                address: document.getElementById('custAddress').value.trim(),
                paymentMethod: document.getElementById('payMethod').value,
                product: "Laptop / Computer Stock Item",
                price: "65000",
                status: "Pending",
                date: new Date().toLocaleDateString()
            };

            var orders = JSON.parse(localStorage.getItem('ghaza_orders') || '[]');
            orders.push(order);
            localStorage.setItem('ghaza_orders', JSON.stringify(orders));

            alert("Order placed successfully! Your Order ID is: " + order.orderId);
            window.location.href = "account.html";
        });
    </script>
</body>
</html>
