<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | Ghaza Laptops and Computers</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #10b981;
            --dark-bg: #0b1120;
            --card-bg: #1e293b;
            --border: #334155;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; }

        /* Navigation Bar */
        nav { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        nav .logo { font-size: 1.3rem; font-weight: bold; color: var(--primary); text-decoration: none; }
        nav .nav-links a { color: var(--text-light); text-decoration: none; margin-left: 1.5rem; }
        nav .nav-links a.active { color: var(--primary); font-weight: bold; }

        .container { max-width: 500px; margin: 2rem auto; padding: 0 1rem; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }

        /* Account Card Container */
        .account-card {
            background: var(--card-bg); 
            border: 1px solid var(--border);
            padding: 2rem; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        /* Sign In / Register Tab Toggle */
        .tab-buttons { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
        .tab-btn {
            flex: 1; padding: 0.8rem; background: transparent; border: none;
            color: var(--text-muted); font-weight: bold; font-size: 1rem;
            cursor: pointer; transition: 0.3s; text-align: center;
        }
        .tab-btn.active { color: var(--primary); border-bottom: 2px solid var(--primary); }

        .form-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.88rem; color: #cbd5e1; }
        
        input, select {
            width: 100%; padding: 0.8rem; border-radius: 6px;
            background: #020617; border: 1px solid var(--border);
            color: var(--text-light); font-size: 0.95rem; outline: none;
            transition: border-color 0.2s ease;
        }
        input:focus, select:focus { border-color: var(--primary); }

        /* Phone Input Prefix */
        .phone-input-group {
            display: flex; align-items: center; background: #020617;
            border: 1px solid var(--border); border-radius: 6px; overflow: hidden; width: 100%;
        }
        .phone-prefix {
            padding: 0.8rem; background: var(--border); color: var(--text-light);
            font-weight: bold; font-size: 0.95rem; border-right: 1px solid var(--border); min-width: 65px; text-align: center;
        }
        .phone-input-group input { border: none; border-radius: 0; }

        /* Inline Button for Email Code */
        .inline-group { display: flex; gap: 0.5rem; }
        .btn-send-code {
            background: var(--warning); color: #020617; border: none;
            padding: 0.8rem 1rem; border-radius: 6px; font-weight: bold;
            cursor: pointer; white-space: nowrap; transition: 0.3s;
        }
        .btn-send-code:hover { opacity: 0.9; }

        /* Action Buttons */
        .btn-submit {
            background: var(--primary); color: white; border: none;
            padding: 0.85rem; border-radius: 6px; font-weight: bold;
            cursor: pointer; width: 100%; font-size: 1rem; transition: 0.3s; margin-top: 0.5rem;
        }
        .btn-submit:hover { background: var(--primary-hover); }

        .btn-logout {
            background: var(--danger); color: white; border: none;
            padding: 0.75rem 1.2rem; border-radius: 6px; font-weight: bold;
            cursor: pointer; margin-top: 1.5rem; width: 100%; transition: 0.3s;
        }
        .btn-logout:hover { opacity: 0.9; }

        /* Profile Details Layout */
        .profile-row { display: flex; justify-content: space-between; padding: 0.8rem 0; border-bottom: 1px solid var(--border); }
        .profile-label { color: var(--text-muted); font-weight: 600; }
        .profile-value { font-weight: bold; color: var(--text-light); }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">Ghaza Laptops & Computers</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop Stock</a>
            <a href="repair.html">Repair Services</a>
            <a href="account.html" class="active">My Account</a>
        </div>
    </nav>

    <div class="container">
        <!-- VIEW 1: AUTHENTICATION CARD (LOGIN & REGISTER TABS) -->
        <div class="account-card" id="authCard">
            <div class="tab-buttons">
                <button class="tab-btn active" id="tabSignIn" onclick="switchTab('signin')">Sign In</button>
                <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">Register</button>
            </div>

            <!-- FORM 1: SIGN IN -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="e.g. user@example.com" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password" required>
                </div>

                <button type="submit" class="btn-submit">Sign In</button>
            </form>

            <!-- FORM 2: REGISTRATION (COMPLETE FORM) -->
            <form id="customerRegisterForm" style="display: none;">
                <div class="form-group">
                    <label for="regFullName">Full Name</label>
                    <input type="text" id="regFullName" placeholder="e.g. Tayyab Khan" required>
                </div>

                <div class="form-group">
                    <label for="regCountry">Country</label>
                    <select id="regCountry" onchange="updateCountryCode()" required>
                        <option value="+92" selected>🇵🇰 Pakistan (+92)</option>
                        <option value="+971">🇦🇪 United Arab Emirates (+971)</option>
                        <option value="+966">🇸🇦 Saudi Arabia (+966)</option>
                        <option value="+44">🇬🇧 United Kingdom (+44)</option>
                        <option value="+1">🇺🇸 United States / Canada (+1)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="regPhone">WhatsApp Phone Number</label>
                    <div class="phone-input-group">
                        <span class="phone-prefix" id="phoneCodeDisplay">+92</span>
                        <input type="tel" id="regPhone" placeholder="3001234567" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regEmail">Email Address</label>
                    <div class="inline-group">
                        <input type="email" id="regEmail" placeholder="e.g. user@example.com" required>
                        <button type="button" class="btn-send-code" onclick="sendEmailVerificationCode()">Get Code</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regEmailCode">Email Verification Code</label>
                    <input type="text" id="regEmailCode" placeholder="Enter 6-digit code" maxlength="6" required>
                </div>

                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" placeholder="Enter password" required>
                </div>

                <div class="form-group">
                    <label for="regConfirmPassword">Confirm Password</label>
                    <input type="password" id="regConfirmPassword" placeholder="Confirm password" required>
                </div>

                <button type="submit" class="btn-submit">Create Account</button>
            </form>
        </div>

        <!-- VIEW 2: LOGGED IN PROFILE DASHBOARD -->
        <div class="account-card" id="profileCard" style="display: none;">
            <h2 style="text-align: center; margin-bottom: 1.5rem; color: var(--primary);">User Profile</h2>
            
            <div class="profile-row">
                <span class="profile-label">Full Name:</span>
                <span class="profile-value" id="dispFullName"></span>
            </div>
            <div class="profile-row">
                <span class="profile-label">Email Address:</span>
                <span class="profile-value" id="dispEmail"></span>
            </div>
            <div class="profile-row">
                <span class="profile-label">WhatsApp Number:</span>
                <span class="profile-value" id="dispPhone"></span>
            </div>

            <button class="btn-logout" onclick="logoutUser()">Sign Out</button>
        </div>
    </div>

    <script>
        var generatedVerificationCode = null;

        // Check active session on load
        function checkUserAuth() {
            var loggedUser = JSON.parse(localStorage.getItem('ghaza_logged_user'));

            if (loggedUser) {
                document.getElementById('authCard').style.display = 'none';
                document.getElementById('profileCard').style.display = 'block';

                document.getElementById('dispFullName').innerText = loggedUser.fullName || 'N/A';
                document.getElementById('dispEmail').innerText = loggedUser.email || 'N/A';
                document.getElementById('dispPhone').innerText = loggedUser.phone || 'N/A';
            } else {
                document.getElementById('authCard').style.display = 'block';
                document.getElementById('profileCard').style.display = 'none';
            }
        }

        // Tab Switching Handler
        function switchTab(tab) {
            var signinTab = document.getElementById('tabSignIn');
            var registerTab = document.getElementById('tabRegister');
            var loginForm = document.getElementById('loginForm');
            var registerForm = document.getElementById('customerRegisterForm');

            if (tab === 'signin') {
                signinTab.classList.add('active');
                registerTab.classList.remove('active');
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
            } else {
                registerTab.classList.add('active');
                signinTab.classList.remove('active');
                registerForm.style.display = 'block';
                loginForm.style.display = 'none';
            }
        }

        // Country Code Prefix Sync
        function updateCountryCode() {
            var selectedCode = document.getElementById('regCountry').value;
            document.getElementById('phoneCodeDisplay').innerText = selectedCode;
        }

        // Verification Code Generation
        function sendEmailVerificationCode() {
            var emailInput = document.getElementById('regEmail').value.trim();
            if (!emailInput) {
                alert("Please enter a valid email address first!");
                return;
            }

            generatedVerificationCode = Math.floor(100000 + Math.random() * 900000).toString();
            alert("Verification code sent to " + emailInput + "!\n\nYour 6-digit verification code is: " + generatedVerificationCode);
        }

        // Sign In Form Handler
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            var email = document.getElementById('loginEmail').value.trim().toLowerCase();
            var password = document.getElementById('loginPassword').value;

            var users = JSON.parse(localStorage.getItem('ghaza_users') || '[]');
            var matchedUser = users.find(function(u) {
                return u.email === email && u.password === password;
            });

            if (matchedUser) {
                localStorage.setItem('ghaza_logged_user', JSON.stringify(matchedUser));
                alert("Welcome back, " + matchedUser.fullName + "!");
                checkUserAuth();
            } else {
                alert("Invalid email address or password. Please check your credentials.");
            }
        });

        // Registration Form Handler
        document.getElementById('customerRegisterForm').addEventListener('submit', function(e) {
            e.preventDefault();

            var fullName = document.getElementById('regFullName').value.trim();
            var email = document.getElementById('regEmail').value.trim().toLowerCase();
            var countryCode = document.getElementById('regCountry').value;
            var phoneBody = document.getElementById('regPhone').value.trim();
            var fullPhone = countryCode + phoneBody;
            var enteredEmailCode = document.getElementById('regEmailCode').value.trim();
            var password = document.getElementById('regPassword').value;
            var confirmPassword = document.getElementById('regConfirmPassword').value;

            if (!generatedVerificationCode) {
                alert("Please click 'Get Code' to generate your email verification code.");
                return;
            }
            if (enteredEmailCode !== generatedVerificationCode) {
                alert("Invalid email verification code!");
                return;
            }
            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }

            var users = JSON.parse(localStorage.getItem('ghaza_users') || '[]');
            var existingUser = users.find(function(u) { return u.email === email; });

            if (existingUser) {
                alert("An account with this email address already exists! Please sign in.");
                switchTab('signin');
                return;
            }

            var newUser = {
                id: Date.now(),
                fullName: fullName,
                email: email,
                phone: fullPhone,
                password: password
            };

            users.push(newUser);
            localStorage.setItem('ghaza_users', JSON.stringify(users));

            // Log user in automatically after registration
            localStorage.setItem('ghaza_logged_user', JSON.stringify(newUser));

            alert("Account registered successfully! Welcome, " + fullName + ".");
            checkUserAuth();
        });

        // Sign Out Handler
        function logoutUser() {
            localStorage.removeItem('ghaza_logged_user');
            alert("You have signed out.");
            checkUserAuth();
        }

        window.onload = checkUserAuth;
    </script>
</body>
</html>
