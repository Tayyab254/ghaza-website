<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Account & Repair Tracking | Ghaza Laptops & Computers</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #10b981;
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --required: #ef4444;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-light); min-height: 100vh; }

        header { background: #020617; border-bottom: 1px solid var(--border); padding: 1rem 2rem; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.4rem; font-weight: bold; color: #60a5fa; text-decoration: none; }
        .nav-links { display: flex; gap: 1.5rem; list-style: none; align-items: center; }
        .nav-links a { color: var(--text-light); text-decoration: none; font-weight: 500; }
        .nav-links a:hover { color: #60a5fa; }
        .req-star { color: var(--required); font-weight: bold; }

        .auth-container { max-width: 480px; margin: 3rem auto; padding: 2rem; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; }
        .auth-tabs { display: flex; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        .tab-btn { background: none; border: none; color: var(--text-muted); font-size: 1.1rem; font-weight: bold; cursor: pointer; padding-bottom: 0.5rem; }
        .tab-btn.active { color: #60a5fa; border-bottom: 2px solid var(--primary); }

        .form-group { margin-bottom: 1.2rem; text-align: left; }
        label { display: block; margin-bottom: 0.4rem; font-size: 0.88rem; color: #cbd5e1; }
        input, textarea, select { width: 100%; padding: 0.75rem; border-radius: 6px; background: #020617; border: 1px solid var(--border); color: white; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); }

        .btn { padding: 0.75rem 1.4rem; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; width: 100%; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-danger { background: var(--required); color: white; width: auto; }

        .dashboard-container { max-width: 950px; margin: 3rem auto; padding: 2rem; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; display: none; }
        .dash-tabs { display: flex; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        
        .data-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        .data-table th, .data-table td { padding: 0.8rem; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        .data-table th { background: #020617; color: var(--text-muted); }

        .badge { padding: 0.25rem 0.6rem; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .badge-warning { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid var(--warning); }
        .badge-success { background: rgba(16, 185, 129, 0.2); color: var(--secondary); border: 1px solid var(--secondary); }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">Ghaza Laptops & Computers</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop Inventory</a></li>
                <li><a href="account.html" style="color: #60a5fa;">Account / Services</a></li>
            </ul>
        </div>
    </header>

    <!-- AUTHENTICATION FORM (LOGIN / REGISTER) -->
    <div class="auth-container" id="authBox">
        <div class="auth-tabs">
            <button class="tab-btn active" id="tabLoginBtn" onclick="switchAuthTab('login')">Login</button>
            <button class="tab-btn" id="tabRegisterBtn" onclick="switchAuthTab('register')">Register Account</button>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm">
            <div class="form-group">
                <label for="loginEmail">Email Address <span class="req-star">*</span></label>
                <input type="email" id="loginEmail" placeholder="e.g. user@gmail.com" required>
            </div>
            <div class="form-group">
                <label for="loginPass">Password <span class="req-star">*</span></label>
                <input type="password" id="loginPass" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>

        <!-- REGISTER FORM -->
        <form id="registerForm" style="display: none;">
            <div class="form-group">
                <label for="regName">Full Name <span class="req-star">*</span></label>
                <input type="text" id="regName" placeholder="e.g. Ali Raza" required>
            </div>
            <div class="form-group">
                <label for="regEmail">Email Address <span class="req-star">*</span></label>
                <input type="email" id="regEmail" placeholder="e.g. user@gmail.com" required>
            </div>
            <div class="form-group">
                <label for="regPhone">WhatsApp Phone Number <span class="req-star">*</span></label>
                <input type="tel" id="regPhone" placeholder="e.g. 03350007575" required>
            </div>
            <div class="form-group">
                <label for="regPass">Password <span class="req-star">*</span></label>
                <input type="password" id="regPass" placeholder="Create password" required>
            </div>
            
            <!-- OTP Step -->
            <div class="form-group" id="otpGroup">
                <label for="regOtp">Verification Code (OTP) <span class="req-star">*</span></label>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="text" id="regOtp" placeholder="Enter 4-digit OTP" required>
                    <button type="button" class="btn btn-primary" onclick="sendOtp()" style="width: 40%; font-size: 0.8rem;">Send OTP</button>
                </div>
                <small style="color: var(--secondary);" id="otpNotice"></small>
            </div>

            <button type="submit" class="btn btn-primary">Create Account</button>
        </form>
    </div>

    <!-- LOGGED-IN DASHBOARD (ORDERS & REPAIR SERVICES) -->
    <div class="dashboard-container" id="userDashboard">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2>Welcome, <span id="dashUserName" style="color: #60a5fa;">User</span></h2>
            <button class="btn btn-danger" onclick="logoutUser()">Log Out</button>
        </div>

        <div class="dash-tabs">
            <button class="tab-btn active" id="tabOrdersBtn" onclick="switchDashTab('orders')">📦 Track Orders</button>
            <button class="tab-btn" id="tabRepairsBtn" onclick="switchDashTab('repairs')">🛠️ Repair & Maintenance Services</button>
        </div>

        <!-- SECTION 1: ORDERS TRACKING -->
        <div id="sectionOrders">
            <h3 style="margin-bottom: 1rem; color: #cbd5e1;">Your Product Orders</h3>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Product Details</th>
                        <th>Price</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="userOrdersTable">
                    <!-- User specific orders render here -->
                </tbody>
            </table>
        </div>

        <!-- SECTION 2: REPAIR SERVICES TRACKING & SUBMISSION -->
        <div id="sectionRepairs" style="display: none;">
            <h3 style="margin-bottom: 1rem; color: #cbd5e1;">Active Repair Tickets & Maintenance History</h3>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Ticket #</th>
                        <th>Device & Issue</th>
                        <th>Service Type</th>
                        <th>Estimated Cost</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="userRepairsTable">
                    <!-- Repair jobs render here -->
                </tbody>
            </table>

            <hr style="border-color: var(--border); margin: 2rem 0;">

            <h4 style="color: #60a5fa; margin-bottom: 1rem;">🔧 Submit New Repair / Maintenance Ticket</h4>
            <form id="repairTicketForm">
                <div class="form-group">
                    <label for="deviceModel">Laptop / Computer Model <span class="req-star">*</span></label>
                    <input type="text" id="deviceModel" placeholder="e.g. HP EliteBook 840 G5 / Custom Desktop PC" required>
                </div>
                <div class="form-group">
                    <label for="serviceType">Required Service <span class="req-star">*</span></label>
                    <select id="serviceType" required>
                        <option value="Hardware Diagnostic & Repair">Hardware Diagnostic & Repair</option>
                        <option value="SSD / RAM Upgrade & Data Cloning">SSD / RAM Upgrade & Data Cloning</option>
                        <option value="Screen / Battery / Keyboard Replacement">Screen / Battery / Keyboard Replacement</option>
                        <option value="Windows OS & Driver Installation">Windows OS & Driver Installation</option>
                        <option value="Thermal Paste & Cooling Fan Service">Thermal Paste & Cooling Fan Service</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="issueDesc">Description of Issue / Special Request <span class="req-star">*</span></label>
                    <textarea id="issueDesc" rows="3" placeholder="Describe hardware issues, beep codes, or upgrade specifications..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: auto;">Submit Repair Request</button>
            </form>
        </div>
    </div>

    <script>
        var generatedOtp = null;

        function switchAuthTab(tab) {
            if (tab === 'login') {
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('tabLoginBtn').classList.add('active');
                document.getElementById('tabRegisterBtn').classList.remove('active');
            } else {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = 'block';
                document.getElementById('tabRegisterBtn').classList.add('active');
                document.getElementById('tabLoginBtn').classList.remove('active');
            }
        }

        function switchDashTab(tab) {
            if (tab === 'orders') {
                document.getElementById('sectionOrders').style.display = 'block';
                document.getElementById('sectionRepairs').style.display = 'none';
                document.getElementById('tabOrdersBtn').classList.add('active');
                document.getElementById('tabRepairsBtn').classList.remove('active');
            } else {
                document.getElementById('sectionOrders').style.display = 'none';
                document.getElementById('sectionRepairs').style.display = 'block';
                document.getElementById('tabRepairsBtn').classList.add('active');
                document.getElementById('tabOrdersBtn').classList.remove('active');
            }
        }

        function sendOtp() {
            generatedOtp = Math.floor(1000 + Math.random() * 9000).toString();
            document.getElementById('otpNotice').innerText = "Verification Code sent: " + generatedOtp;
            alert("Your demo OTP is: " + generatedOtp);
        }

        // Registration Submission
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var otpEntered = document.getElementById('regOtp').value.trim();

            if (generatedOtp && otpEntered !== generatedOtp) {
                alert("Invalid OTP Code! Please enter the correct code.");
                return;
            }

            var user = {
                fullName: document.getElementById('regName').value.trim(),
                email: document.getElementById('regEmail').value.trim(),
                phone: document.getElementById('regPhone').value.trim(),
                password: document.getElementById('regPass').value.trim()
            };

            var users = JSON.parse(localStorage.getItem('ghaza_users') || '[]');
            users.push(user);
            localStorage.setItem('ghaza_users', JSON.stringify(users));

            sessionStorage.setItem('ghaza_active_user', JSON.stringify(user));
            checkSession();
        });

        // Login Submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var email = document.getElementById('loginEmail').value.trim();
            var pass = document.getElementById('loginPass').value.trim();

            var users = JSON.parse(localStorage.getItem('ghaza_users') || '[]');
            var match = users.find(function(u) { return u.email === email && u.password === pass; });

            if (match) {
                sessionStorage.setItem('ghaza_active_user', JSON.stringify(match));
                checkSession();
            } else {
                alert("Invalid Email or Password!");
            }
        });

        // Submit Repair Ticket
        document.getElementById('repairTicketForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var activeUser = JSON.parse(sessionStorage.getItem('ghaza_active_user'));

            var ticket = {
                ticketId: "REP-" + Math.floor(1000 + Math.random() * 9000),
                phone: activeUser.phone,
                device: document.getElementById('deviceModel').value.trim(),
                serviceType: document.getElementById('serviceType').value,
                description: document.getElementById('issueDesc').value.trim(),
                estCost: "Pending Inspection",
                status: "In Progress"
            };

            var repairs = JSON.parse(localStorage.getItem('ghaza_repairs') || '[]');
            repairs.push(ticket);
            localStorage.setItem('ghaza_repairs', JSON.stringify(repairs));

            alert("Repair ticket created successfully! Ticket ID: " + ticket.ticketId);
            document.getElementById('repairTicketForm').reset();
            loadUserRepairs(activeUser.phone);
        });

        function logoutUser() {
            sessionStorage.removeItem('ghaza_active_user');
            location.reload();
        }

        function checkSession() {
            var activeUser = JSON.parse(sessionStorage.getItem('ghaza_active_user'));
            if (activeUser) {
                document.getElementById('authBox').style.display = 'none';
                document.getElementById('userDashboard').style.display = 'block';
                document.getElementById('dashUserName').innerText = activeUser.fullName;

                loadUserOrders(activeUser.phone);
                loadUserRepairs(activeUser.phone);
            }
        }

        function loadUserOrders(userPhone) {
            var orders = JSON.parse(localStorage.getItem('ghaza_orders') || '[]');
            var tbody = document.getElementById('userOrdersTable');
            tbody.innerHTML = '';

            var myOrders = orders.filter(function(o) {
                return o.phone && o.phone.includes(userPhone);
            });

            if (myOrders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="color: var(--text-muted); text-align:center;">No active or past orders found.</td></tr>';
                return;
            }

            myOrders.forEach(function(item) {
                var tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong style="color:#60a5fa;">${item.orderId || 'N/A'}</strong></td>
                    <td>${item.product}</td>
                    <td>Rs. ${item.price}</td>
                    <td><span class="badge badge-success">${item.status || 'Processing'}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function loadUserRepairs(userPhone) {
            var repairs = JSON.parse(localStorage.getItem('ghaza_repairs') || '[]');
            var tbody = document.getElementById('userRepairsTable');
            tbody.innerHTML = '';

            var myRepairs = repairs.filter(function(r) {
                return r.phone && r.phone.includes(userPhone);
            });

            if (myRepairs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="color: var(--text-muted); text-align:center;">No active repair tickets found.</td></tr>';
                return;
            }

            myRepairs.forEach(function(item) {
                var tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong style="color:#60a5fa;">${item.ticketId}</strong></td>
                    <td><strong>${item.device}</strong><br><small style="color:var(--text-muted);">${item.description}</small></td>
                    <td>${item.serviceType}</td>
                    <td>${item.estCost}</td>
                    <td><span class="badge badge-warning">${item.status}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.onload = checkSession;
    </script>
</body>
</html>
