<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Inventory | Ghaza Laptops & Computers</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #10b981;
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --required: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-light); }

        header { background: #020617; border-bottom: 1px solid var(--border); padding: 1rem 2rem; position: sticky; top: 0; z-index: 100; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.4rem; font-weight: bold; color: #60a5fa; text-decoration: none; }
        .nav-links { display: flex; gap: 1.5rem; list-style: none; align-items: center; }
        .nav-links a { color: var(--text-light); text-decoration: none; font-weight: 500; }
        .nav-links a:hover { color: #60a5fa; }
        .req-star { color: var(--required); font-weight: bold; }

        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .shop-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
        
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        .product-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
        .product-body { padding: 1.2rem; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .product-title { font-size: 1.1rem; color: #f8fafc; margin-bottom: 0.5rem; }
        .product-price { font-size: 1.2rem; color: var(--secondary); font-weight: bold; margin-bottom: 1rem; }
        
        .btn { padding: 0.6rem 1.2rem; border-radius: 6px; font-weight: bold; text-decoration: none; cursor: pointer; border: none; text-align: center; }
        .btn-primary { background: var(--primary); color: white; }

        /* Modal Overlay */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 6, 23, 0.85); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(5px); }
        .modal-box { background: var(--card-bg); border: 1px solid var(--border); padding: 2rem; border-radius: 12px; width: 100%; max-width: 450px; }
        
        .form-group { margin-bottom: 1.2rem; text-align: left; }
        label { display: block; margin-bottom: 0.4rem; font-size: 0.88rem; color: #cbd5e1; }
        input { width: 100%; padding: 0.75rem; border-radius: 6px; background: #020617; border: 1px solid var(--border); color: white; }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">Ghaza Laptops & Computers</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html" style="color: #60a5fa;">Shop Inventory</a></li>
                <li><a href="#" onclick="openTrackModal()">📦 Track Order</a></li>
                <li><a href="account.html">Account</a></li>
            </ul>
        </div>
    </header>

    <div class="container">
        <div class="shop-header">
            <div>
                <h1>Shop Laptops & Computers</h1>
                <p style="color: var(--text-muted);">Available stock in G-9 Markaz, Islamabad</p>
            </div>
            <button onclick="openTrackModal()" class="btn btn-primary" style="background: var(--card-bg); border: 1px solid var(--border);">📦 Track Existing Order</button>
        </div>

        <div class="product-grid" id="productContainer">
            <!-- Dynamic products loaded here -->
        </div>
    </div>

    <!-- Track Order Modal -->
    <div id="trackModal" class="modal-overlay">
        <div class="modal-box">
            <h2 style="color: #60a5fa; margin-bottom: 0.5rem;">📦 Track Order Status</h2>
            <form id="trackOrderForm">
                <div class="form-group">
                    <label for="trackInput">Order ID / WhatsApp Phone <span class="req-star">*</span></label>
                    <input type="text" id="trackInput" placeholder="e.g. GHZ-1042 or 03350007575" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Search Order</button>
                <button type="button" onclick="closeTrackModal()" class="btn" style="width: 100%; margin-top: 0.5rem; background: transparent; color: var(--text-muted);">Close</button>
            </form>
            <div id="trackResult" style="margin-top: 1rem;"></div>
        </div>
    </div>

    <script>
        function loadProducts() {
            var stock = JSON.parse(localStorage.getItem('ghaza_stock') || '[]');
            var container = document.getElementById('productContainer');
            container.innerHTML = '';

            if (stock.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted);">No products in stock currently. Check back soon!</p>';
                return;
            }

            stock.forEach(function(item) {
                var card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-body">
                        <div>
                            <h3 class="product-title">${item.title}</h3>
                            <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 0.8rem;">${item.specs}</p>
                        </div>
                        <div>
                            <div class="product-price">Rs. ${item.price}</div>
                            <a href="checkout.html?prodId=${item.id}" class="btn btn-primary" style="display:block;">Buy Now</a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openTrackModal() { document.getElementById('trackModal').style.display = 'flex'; }
        function closeTrackModal() { document.getElementById('trackModal').style.display = 'none'; document.getElementById('trackResult').innerHTML = ''; }

        document.getElementById('trackOrderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var query = document.getElementById('trackInput').value.trim().toLowerCase();
            var orders = JSON.parse(localStorage.getItem('ghaza_orders') || '[]');
            var match = orders.find(function(o) {
                return (o.orderId && o.orderId.toLowerCase() === query) || (o.phone && o.phone.includes(query));
            });
            var resultDiv = document.getElementById('trackResult');
            if (match) {
                resultDiv.innerHTML = `
                    <div style="background: #020617; padding: 1rem; border-radius: 8px; border: 1px solid var(--secondary);">
                        <p><strong>Order:</strong> ${match.product}</p>
                        <p><strong>Status:</strong> <span style="color: var(--secondary);">${match.status || 'Processing'}</span></p>
                    </div>`;
            } else {
                resultDiv.innerHTML = '<p style="color: var(--required);">No matching order found.</p>';
            }
        });

        window.onload = loadProducts;
    </script>
</body>
</html>
